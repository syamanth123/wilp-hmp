# Nginx reverse proxy for HMP (single EC2 host).
# Terminates TLS and proxies to the Next.js server on 127.0.0.1:3000.
#
# Security RESPONSE headers (HSTS, the per-request CSP nonce, X-Frame-Options,
# etc.) are emitted by the Next app + middleware — Nginx passes them through and
# does NOT duplicate them (duplicating CSP would break the nonce).
#
# Replace `hmp.example.edu` with your domain (or the EC2 public IP for bare-IP
# testing — in which case drop the TLS server block and serve directly on :80).

upstream hmp_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect + ACME (certbot) challenge passthrough.
server {
    listen 80;
    server_name hmp.example.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hmp.example.edu;

    ssl_certificate     /etc/letsencrypt/live/hmp.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hmp.example.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # MUST be >= the app's serverActions.bodySizeLimit (10mb) so attachment /
    # corpus uploads aren't rejected at the proxy before reaching Next.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Immutable Next build assets — long cache.
    location /_next/static/ {
        proxy_pass http://hmp_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://hmp_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # CRITICAL: NextAuth trustHost + secure-cookie handling behind TLS
        # termination depends on the original scheme/host being forwarded.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Upgrade passthrough (harmless if unused).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headroom for the PDF export (LibreOffice) round-trip.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
